# Build one installable theme ZIP and replace the same release asset on main pushes.
name: Publish LechFolio ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lechfolio-latest-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Check PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -r -n 1 php -l

      - name: Package and validate the theme
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=lechfolio/ --output=dist/lechfolio.zip HEAD
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/lechfolio.zip') as archive:
              names = set(archive.namelist())
              required = {'lechfolio/style.css', 'lechfolio/index.php', 'lechfolio/functions.php', 'lechfolio/theme.json'}
              assert required <= names, 'Missing required theme files'
              assert all(name.startswith('lechfolio/') for name in names), 'Invalid theme folder'
              assert not any('/.github/' in name or '/.git/' in name for name in names), 'Development files included'
              assert archive.testzip() is None, 'Corrupt ZIP'
          PY

      - name: Replace the latest release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          commit=$(git rev-parse HEAD)
          cat > dist/release-notes.md <<EOF
          Installable LechFolio WordPress theme from the main branch.

          Download lechfolio.zip below and upload it under Appearance > Themes > Add New > Upload Theme.

          Source commit: $commit

          This rolling release and its ZIP are replaced on each push to main.
          EOF
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/lechfolio.zip --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$commit" -F force=true
            gh release edit latest --title "LechFolio Latest" --notes-file dist/release-notes.md --latest
          else
            gh release create latest dist/lechfolio.zip --target "$commit" --title "LechFolio Latest" --notes-file dist/release-notes.md --latest
          fi
